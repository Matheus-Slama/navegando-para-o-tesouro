name: Visual regression

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  visual:
    # References are captured on Windows; keep the same font rendering platform.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Firefox and WebKit
        run: pnpm test:browsers:install
      - name: Compare all devices and screens
        run: pnpm test:visual
      - name: Check Firefox and WebKit on all devices
        if: ${{ !cancelled() }}
        run: pnpm test:cross-browser
      - name: Upload screenshots, differences and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: tests/visual/results/
          retention-days: 14
